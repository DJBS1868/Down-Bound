<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#14121b">
  <meta name="description" content="Down-Bound — load your crew into a minecart, descend into the deep, and bring home the gold.">
  <title>Down-Bound — A Minecart Adventure</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314121b'/%3E%3Cpath d='M7 25 23 9' stroke='%23f4bb55' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M15 4c5 0 9 2 12 6-5-2-9-2-13 1M4 14c0-5 2-9 6-12-2 5-2 9 1 13' fill='%23f4bb55'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div class="app-grain" aria-hidden="true"></div>

    <header class="topbar">
      <button class="brand" id="brandBtn" aria-label="How to play">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M7.3 24.7 22 10" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
            <path d="M15.2 5.2c4.7-.2 9 2 11.6 6.1-4.3-1.6-8.3-1.4-11.9.7" fill="currentColor"/>
            <path d="M5.4 16.5c.2-4.8 2.6-8.5 6.4-10.8-1.5 4.2-1.3 8.1.6 11.6" fill="currentColor"/>
          </svg>
        </span>
        <span class="brand-type">
          <strong>DOWN-BOUND</strong>
          <small>DEEP VEIN CO.</small>
        </span>
      </button>

      <div class="top-actions">
        <div class="coin-pill" id="coinPill" aria-label="Coins">
          <span class="coin-icon" aria-hidden="true"></span>
          <span id="coinCount">0</span>
        </div>
        <button class="icon-btn" id="soundBtn" aria-label="Toggle sound" aria-pressed="true">
          <svg class="sound-on" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 9.2v5.6h3.4l4.1 3.4V5.8L7.4 9.2H4Z" fill="currentColor"/>
            <path d="M14.6 8.2a5 5 0 0 1 0 7.6M17.3 5.5a8.8 8.8 0 0 1 0 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <svg class="sound-off" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 9.2v5.6h3.4l4.1 3.4V5.8L7.4 9.2H4Z" fill="currentColor"/>
            <path d="m15 9 5 5m0-5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-btn" id="helpBtn" aria-label="How to play">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9.6 9.2a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1.1 1-1.1 1.9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle cx="12" cy="17.2" r="1.25" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </header>

    <main id="stage" class="stage"></main>
    <div id="overlayRoot" class="overlay-root"></div>
    <div id="toastRoot" class="toast-root" aria-live="polite"></div>
    <div id="dragRoot" class="drag-root" aria-hidden="true"></div>
  </div>

  <noscript>Down-Bound needs JavaScript enabled to play.</noscript>
  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
